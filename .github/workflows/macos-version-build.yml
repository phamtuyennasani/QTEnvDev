name: Build QTEnvDev macOS Packages
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-macos:
    # Manual runs may be started from any branch; push builds stay limited to release branches.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    name: Build (${{ matrix.arch }})
    # 使用 strategy matrix 实现分架构并行构建
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: x64
            os: macos-15-intel # Intel 运行环境
            target: x64
          - arch: arm64
            os: macos-latest # Apple Silicon 运行环境
            target: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'src/helper-go/go.mod'
          cache-dependency-path: 'src/helper-go/go.sum'

      - name: Cache node_modules and node-gyp
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
            .yarn/cache
            ~/.cache/node-gyp
          key: ${{ runner.os }}-${{ matrix.arch }}-node-${{ hashFiles('**/package.json') }}

      - name: Install Yarn and build tools
        run: |
          npm install -g yarn node-gyp

      - name: Install dependencies
        run: yarn install

      - name: Build Go helper
        run: |
          cd "$GITHUB_WORKSPACE/src/helper-go"
          chmod +x ./build.sh
          bash ./build.sh # 脚本会根据当前 matrix 架构自动构建

      - name: Verify helper version sync
        run: npx tsx scripts/helper-version-sync-test.ts

      - name: Build Electron App (unsigned)
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: yarn build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QTEnvDev-macOS-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap
