name: Build QTEnvDev Windows Packages
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  actions: read
  contents: read

jobs:
  build-windows:
    # Manual runs may be started from any branch; push builds stay limited to
    # the repository's release branches above.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    name: Build Windows Packages (x64)
    runs-on: windows-2022
    # Two release-signing requests may each wait for manual approval.
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # 安装必要的构建工具
          choco install -y make

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'src/helper-go/go.mod'
          cache-dependency-path: 'src/helper-go/go.sum'

      - name: Cache node_modules and node-gyp
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
            .yarn/cache
            ~/.cache/node-gyp
            ~\AppData\Local\node-gyp
          key: ${{ runner.os }}-x64-node-${{ hashFiles('**/package.json') }}

      - name: Install Yarn and build tools
        run: |
          npm install -g yarn node-gyp
          python -m pip install --upgrade pip

      - name: Install dependencies with Yarn
        run: |
          # Force link against WinRT runtime objects
          $env:LINK = "runtimeobject.lib"
          yarn install

      - name: Build Go helper with build-win.ps1
        run: |
          go install github.com/tc-hib/go-winres@latest
          $GOBIN = $(go env GOPATH) + "\bin"
          $env:PATH = "$GOBIN;$env:PATH"
          cd "$env:GITHUB_WORKSPACE/src/helper-go"
          go mod download
          go-winres make
          # 使用 PowerShell 脚本构建
          .\build-win.ps1

      - name: Verify helper version sync
        run: npx tsx scripts/helper-version-sync-test.ts

      - name: Build Windows application (unsigned)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          cd "$env:GITHUB_WORKSPACE"
          yarn build

      - name: Upload Windows artifacts (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: QTEnvDev-Windows-x64
          path: |
            release/QTEnvDev-Setup-*.exe
            release/QTEnvDev-Portable-*.exe
            release/*.exe
            release/*.msi
            release/*.yml
            release/*.blockmap
